name: build and tests

# The shared server CI of Snail.Sdk. Framework-dependent, since Entity Framework and the ONNX runtime keep it from being
# native: published and asked over stdio and over HTTP, the way the machine runs it.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: orldev/Snail.Sdk/.github/workflows/mcp-ci.yml@v1
    with:
      name: Snail.MCP.Memory
      native: false
      contract-variable: SNAIL_MEMORY_SERVER
      contract-filter: FullyQualifiedName~StdioContract|FullyQualifiedName~HttpContract
