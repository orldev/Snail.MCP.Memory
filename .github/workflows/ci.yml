name: build and tests

# Every push, on every branch: the tests, and the server as it is published — framework-dependent, since Entity
# Framework and the ONNX runtime keep it from being native — started and asked over stdio and over HTTP.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Snail.MCP.Memory.sln -c Release

  published:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src -c Release -o published
      - name: Answers over stdio
        env:
          SNAIL_MEMORY_SERVER: ${{ github.workspace }}/published/Snail.MCP.Memory.dll
        run: dotnet test tests -c Release --filter "FullyQualifiedName~StdioContract|FullyQualifiedName~HttpContract"
