name: release to NuGet

# The shared server release of Snail.Sdk (docs/publishing.md): one framework-dependent tool package. A v* tag releases;
# run by hand, it builds and checks the package and pushes only when asked to.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: The version to pack, such as 0.2.0 or 0.2.0-preview.1
        required: true
      push:
        description: Push the packages to NuGet
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: read
      id-token: write
    uses: orldev/Snail.Sdk/.github/workflows/mcp-publish.yml@v1
    with:
      name: Snail.MCP.Memory
      native: false
      contract-variable: SNAIL_MEMORY_SERVER
      contract-filter: FullyQualifiedName~StdioContract|FullyQualifiedName~HttpContract
      version: ${{ inputs.version }}
      push: ${{ github.event_name == 'push' || inputs.push }}
    secrets: inherit
